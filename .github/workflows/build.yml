name: Build & Test

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure & Build x64
        run: |
          cmake -S . -B build-x64 -A x64
          cmake --build build-x64 --config Release

      - name: Configure & Build x86
        run: |
          cmake -S . -B build-x86 -A Win32
          cmake --build build-x86 --config Release

      - name: Run end-to-end 7-Zip tests (Windows x64)
        run: |
          python tests/test_plugin.py --dll build-x64/Release/TribesVol.64.dll

      - name: Package Windows release archive
        shell: pwsh
        run: |
          $stage = "dist/T1VolumesFor7z"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build-x64/Release/TribesVol.64.dll $stage/
          Copy-Item build-x86/Release/TribesVol.32.dll $stage/
          Copy-Item scripts/install.ps1 $stage/
          Copy-Item scripts/uninstall.ps1 $stage/
          Copy-Item README.md $stage/
          Copy-Item LICENSE $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/T1VolumesFor7z-windows.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: T1VolumesFor7z-windows
          path: |
            dist/T1VolumesFor7z-windows.zip
            build-x64/Release/TribesVol.64.dll
            build-x86/Release/TribesVol.32.dll

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install modular 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip

      - name: Configure & Build Linux x64
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run end-to-end 7-Zip tests (Linux x64)
        run: |
          python3 tests/test_plugin.py --dll build/TribesVol.so

      - name: Package Linux release archive
        run: |
          mkdir -p dist/T1VolumesFor7z-linux-x64
          cp build/TribesVol.so dist/T1VolumesFor7z-linux-x64/
          cp scripts/install.sh scripts/uninstall.sh dist/T1VolumesFor7z-linux-x64/
          chmod +x dist/T1VolumesFor7z-linux-x64/install.sh dist/T1VolumesFor7z-linux-x64/uninstall.sh
          cp README.md LICENSE dist/T1VolumesFor7z-linux-x64/
          tar -czf dist/T1VolumesFor7z-linux-x64.tar.gz -C dist/T1VolumesFor7z-linux-x64 .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: T1VolumesFor7z-linux-x64
          path: |
            dist/T1VolumesFor7z-linux-x64.tar.gz
            build/TribesVol.so

  release:
    needs: [ build-windows, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/T1VolumesFor7z-windows.zip
            artifacts/TribesVol.64.dll
            artifacts/TribesVol.32.dll
            artifacts/T1VolumesFor7z-linux-x64.tar.gz
            artifacts/TribesVol.so
